services:
  redis:
    image: redis:latest
    container_name: currency-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped

  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    container_name: currency-api
    ports:
      - "8000:8000"
    environment:
      - REDIS_URL=redis://redis:6379/0
      - API_V1_PREFIX=/v1
      - PROJECT_NAME=Currency & Exchange Microservice
    depends_on:
      - redis
    restart: unless-stopped

volumes:
  redis_data:
